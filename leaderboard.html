<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
G THE GENIUS | Live Leaderboard
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

<div class="logo">

🛡️ G THE GENIUS

<span>
Live Rank
</span>

</div>


<nav>

<a href="index.html">
Home
</a>

<a href="mocktest.html">
Mock Test
</a>

</nav>

</header>





<section class="features">


<h2>
🏆 Overall Rank List
</h2>



<div class="glass-card">


<table style="width:100%;color:white;">


<thead>

<tr>

<th>
Rank
</th>

<th>
Email
</th>

<th>
Score
</th>

</tr>

</thead>


<tbody id="leaderboard">

<tr>
<td colspan="3">
Loading...
</td>
</tr>


</tbody>


</table>



</div>


</section>




<script type="module">


import {db}
from "./firebase-config.js";


import {

collection,
getDocs,
query,
orderBy

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const board =
document.getElementById("leaderboard");





async function loadLeaderboard(){


try{


const q=query(

collection(db,"results"),

orderBy("score","desc")

);




const snapshot =
await getDocs(q);



board.innerHTML="";



let rank=1;



snapshot.forEach(doc=>{


let data=doc.data();



board.innerHTML +=

`

<tr>

<td>
${rank}
</td>


<td>
${data.email}
</td>


<td>
${data.score}/20
</td>


</tr>

`;



rank++;


});



}

catch(error){


console.log(error);


}



}




loadLeaderboard();



</script>




</body>

</html>
